name: CI

# CodeQL's `actions/missing-workflow-permissions` raised one alert per job: with
# no `permissions` block the token inherits the repository default, which is
# more reach than any job here needs. Every job only checks the repository out,
# so `contents: read` is the whole grant. `actions/upload-artifact` does not use
# this token (it authenticates with the workflow's own runtime token), so the
# artefact uploads in `verify`, `nightly` and `visual` are unaffected.
permissions:
  contents: read

on:
  push:
    branches: [main, master, 'feat/**']
  pull_request:
  schedule:
    # Nightly at 19:00 UTC (03:00 Beijing): the engines that are not worth a run
    # on every commit, plus the long benchmark. Waiting for a push let a
    # WebKit-only start-button regression sit unnoticed for days.
    - cron: '0 19 * * *'
  # Manual runs exist for `visual` only: everything else runs on its own
  # trigger, so a dispatch skips `verify` and `nightly` (their `if:` below) and
  # runs just the baseline comparison, on demand. The Actions page gets a
  # "Run workflow" button; the `visual` job uploads its diff images either way.
  workflow_dispatch:

concurrency:
  # 同一 ref 的新推送取消在飞 run, 只跑最新头的 CI —— Wang 2026-11-12 定(避免 CI 等待):
  # 合入 main 后才跑完整 CI; 完整 CI 未跑完又有新合入, 取消在跑的, 新合入后重跑。
  # 被取消的 run 不是判决, 只有跑完的 run 才算数。分组带事件名: 定时 run 只取消定时 run,
  # 不与合入的 run 互相掐(夜半同规则已落地, 其 CI 无定时触发, 故不带事件名)。
  group: ci-${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  verify:
    if: github.event_name == 'push' || github.event_name == 'pull_request' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Rust + wasm target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install clang (vendored C/C++ -> wasm)
        run: sudo apt-get update && sudo apt-get install -y clang llvm

      # §一.39: `dtolnay/rust-toolchain@stable` pins no version, and a clippy
      # 1.98 upgrade turned the *first* step of this job (`verify:clippy`) red
      # with nobody expecting it. Printing the versions makes "which toolchain
      # judged this commit" a fact in the log instead of a guess after the
      # fact. `scripts/verify-ci.mjs` asserts this step exists and still comes
      # before the clippy gate.
      - name: Toolchain versions (rustc / clippy / node / npm)
        run: |
          rustc --version
          cargo clippy --version
          node --version
          npm --version

      - run: npm ci

      - name: Clippy (correctness / suspicious / perf)
        run: npm run verify:clippy

      - name: Rust DSP tests
        run: npm run test:rust

      # Phase 2 (true multi-instance) closed the CI gap the phase-1 branch
      # carried: the 15 VST3 integration tests had never run in CI, so a
      # green branch did not mean the plugin was tested. These steps run the
      # plugin crate's tests (release: the fingerprint tests need release
      # speed) and its clippy gate with the same flags as verify:clippy.
      # The custom editor (phase 2 item 1) pulls nih_plug_egui/baseview,
      # whose Linux build needs X11/GL dev files: the `x11` crate's build
      # script probes pkg-config for `gl` / `x11` / `x11-xcb` (features
      # glx/xlib/xlib_xcb) and fails the build without them. The stock
      # ubuntu runner has the runtime libs but not the .pc files, so the
      # VST3 steps cannot run before this install. Same five packages as
      # the local dev setup (see crates/synth-vst3/README.md).
      - name: Install X11/GL dev libs (VST3 editor)
        run: sudo apt-get update && sudo apt-get install -y libgl1-mesa-dev libx11-xcb-dev libxcursor-dev libxrandr-dev libxi-dev

      - name: VST3 plugin tests (release)
        run: npm run test:vst3

      - name: VST3 plugin clippy
        run: npm run verify:clippy-vst3

      # Phase 2 ② CLAP: build the CLAP-only plugin (no vst3 feature, so no
      # `vst3-sys`) and verify `clap_entry` is exported and
      # `GetPluginFactory` is not. The script does the build plus both
      # checks. This step runs after the X11/GL install above: the editor
      # module compiles in every feature set, so the CLAP build needs the
      # same dev libs.
      - name: CLAP plugin build (release)
        run: scripts/package-clap.sh

      # The build comes *before* the tests on purpose: `src/generated/*.wasm`
      # is a build artefact and is gitignored, so on a fresh runner the unit
      # tests cannot resolve `@/generated/synth_core.wasm?url` until the cores
      # exist. Running them first failed sixteen files with "Failed to resolve
      # import" on a clean checkout (found by the second full sweep), and
      # `npm run verify` had the same ordering bug.
      - name: Production build (WASM + SW)
        run: npm run build

      - name: Front-end unit + worklet integration tests
        run: npm test

      # binaryen (wasm-opt / wasm-dis) is a devDependency, so `npm ci` above
      # installs it and `npm run build` (the step before this one) already
      # optimised both cores. Nothing extra to install here; if the binary is
      # ever unavailable the build degrades to unoptimised cores and
      # `verify:budget` fails on the dist total instead of the build breaking.
      - name: WASM quality gates (SIMD + scalar)
        run: node scripts/verify-wasm.mjs && node scripts/verify-wasm.mjs src/generated/synth_core_scalar.wasm && node scripts/verify-wasm-features.mjs

      - name: Lint
        run: npm run lint

      - name: Release preflight (version / changelog)
        run: npm run verify:release

      - name: Dist integrity
        run: npm run verify:dist

      - name: Payload budget
        run: npm run verify:budget

      - name: Audio quality gates (time + frequency domain)
        run: npm run verify:audio

      - name: Preset fingerprints (every factory preset)
        run: npm run verify:presets

      - name: Preset fingerprints (2x oversampling)
        run: npm run verify:presets:2x

      - name: Sustained-load benchmark
        run: npm run verify:bench

      - name: DSP regression baseline
        run: npm run test:dsp

      - name: DSP regression baseline (2x oversampling)
        run: npm run verify:dsp:2x

      # P13.2: the tool server is a gate too. This runs the same golden session
      # the tools' tests do — every P13.2 tool called twice, compared
      # byte-for-byte — through the `npm run mcp` entry point itself.
      - name: MCP tool server golden session
        run: npm run mcp -- --self-test

      # P13.5: the two LLM-interface documents are a contract, so a gate checks
      # they do not drift from the tool registry and the code's own limits and
      # error codes. No browser, no dist — it only reads the docs and the
      # registry (and runs before the Chromium install below).
      - name: LLM interface docs vs the live registry
        run: npm run verify:llm-docs

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Browser E2E (Chromium)
        run: npm run test:e2e

      # The performance spec is not in the Chromium suite: the chromium project
      # ignores it and it runs here on its own, single worker, so its frame-rate
      # windows measure the app instead of the other workers (v1.111.0: the same
      # build read 13.8-20.0 fps inside the parallel suite against 60.0 alone).
      # `npm run release` runs these two commands in the same order.
      - name: Performance E2E (Chromium, isolated single worker)
        run: npm run test:perf

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dist
          path: dist
          retention-days: 7

  # Phase 2 (macOS/Windows packages): the VST3 plugin is built, tested and
  # packaged natively on all three OSes — never cross-compiled from Linux,
  # because the vendored C++ bridge is compiled by build.rs with the host
  # compiler. One matrix job instead of three copies: the steps are the
  # same on every runner, only the OS-specific setup differs. It runs on
  # push/PR (the gate for a branch); the schedule already has the nightly
  # job and does not need a second packaging pass.
  vst3-packages:
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      # ubuntu-latest has no clang: the vendored C/C++ bridge needs it, and
      # so does the `llvm-ar` the bridge archives with.
      - name: Install clang + llvm (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y clang llvm

      # The macOS bundle is a universal binary (arm64 + x86_64); the runner
      # is arm64, so the x86_64 target has to be added. The bridge's
      # build.rs passes --target to clang for the non-host slice.
      - name: Add x86_64 macOS target (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: rustup target add x86_64-apple-darwin

      # windows-latest ships LLVM, but its bin dir is not guaranteed to be
      # on PATH for every shell; make it explicit before the version step
      # below tries to run clang.
      - name: Put LLVM on PATH (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          if [ -d "/c/Program Files/LLVM/bin" ]; then
            echo 'C:\Program Files\LLVM\bin' >> "$GITHUB_PATH"
          else
            echo 'LLVM bin dir not found at C:\Program Files\LLVM\bin' >&2
            exit 1
          fi

      # macOS runners do NOT ship llvm-ar anywhere in Xcode 26.6: run
      # 42349152642's failing step listed
      # <developer-dir>/Toolchains/XcodeDefault.xctoolchain/usr/bin/ and
      # it holds `ar`, `clang`, `llvm-nm` — but no `llvm-ar` (the round-2
      # premise, "llvm-ar is inside the toolchain dir, just not on PATH",
      # was wrong; it is not a PATH problem, the file does not exist).
      # build.rs defaults AR to llvm-ar and archives with `crs`, and the
      # "Toolchain versions" step prints `llvm-ar --version` where the tool
      # supports it (the BSD ar shim below does not), so both need the name
      # to resolve. The toolchain's own `ar` accepts the same `crs` flags
      # and writes the same archive format, so the step shims llvm-ar -> ar
      # in a temp bin dir on PATH. If a future Xcode ships a real llvm-ar,
      # the fast path below uses it instead. A missing `ar` is a hard
      # failure, not a silent skip. The dir also holds the same Xcode clang
      # the runner already resolves, so the toolchain the versions step
      # prints does not change.
      - name: Put Xcode toolchain on PATH (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          bin_dir="$(xcode-select -p)/Toolchains/XcodeDefault.xctoolchain/usr/bin"
          shimmed=0
          if [ -x "$bin_dir/llvm-ar" ]; then
            llvm_ar="$bin_dir/llvm-ar"
          elif [ -x "$bin_dir/ar" ]; then
            # Xcode 26.6 ships no llvm-ar (run 42349152642 proves it with
            # the ls listing); shim it to the toolchain's own `ar`.
            shim_dir="$RUNNER_TEMP/xcode-llvm-ar-shim"
            mkdir -p "$shim_dir"
            ln -sf "$bin_dir/ar" "$shim_dir/llvm-ar"
            echo "llvm-ar not shipped by Xcode 26.6; shimming llvm-ar -> $bin_dir/ar"
            llvm_ar="$shim_dir/llvm-ar"
            shimmed=1
          else
            echo "neither llvm-ar nor ar found in $bin_dir" >&2
            ls "$bin_dir" >&2 || true
            exit 1
          fi
          # Version evidence: a real llvm-ar prints --version, but the shim
          # points at BSD ar, which has no --version flag (run 42350688123:
          # `ar --version` prints usage and exits 1, killing this step
          # under bash -e). Prove the shim functionally instead: run the
          # exact operation build.rs needs (`crs` archive + member) and
          # check the archive is non-empty and lists its member.
          if [ "$shimmed" -eq 0 ]; then
            "$llvm_ar" --version
          else
            probe_dir="$RUNNER_TEMP/xcode-llvm-ar-probe"
            mkdir -p "$probe_dir"
            printf 'probe' > "$probe_dir/probe.txt"
            "$llvm_ar" crs "$probe_dir/libprobe.a" "$probe_dir/probe.txt"
            test -s "$probe_dir/libprobe.a"
            "$llvm_ar" t "$probe_dir/libprobe.a"
          fi
          echo "$bin_dir" >> "$GITHUB_PATH"
          echo "$(dirname "$llvm_ar")" >> "$GITHUB_PATH"

      # Toolchain evidence, before anything that can fail: which compiler
      # judged this commit is a fact in the log, not a guess afterwards
      # (§一.39, same reason the verify job prints its versions first).
      # The Windows lines are the answer to "what toolchain is actually on
      # windows-latest": LLVM clang + llvm-ar are expected there, and the
      # log proves or disproves it on every run.
      - name: Toolchain versions (rustc / cargo / clang / llvm-ar)
        shell: bash
        run: |
          rustc --version
          cargo --version
          clang --version
          # llvm-ar prints --version only where the tool supports it. On
          # macOS it resolves to the BSD ar shim (Xcode 26.6 ships no
          # llvm-ar), and BSD ar has no --version flag (run 42350688123:
          # usage + exit 1). Print the shim note instead of failing the
          # step; the functional `crs` probe in the PATH step above is the
          # real evidence on that leg. A missing llvm-ar is still a hard
          # failure, not a silent skip.
          if llvm-ar --version 2>/dev/null; then
            :
          elif command -v llvm-ar >/dev/null 2>&1; then
            echo "llvm-ar: $(command -v llvm-ar) is the BSD ar shim (no --version; crs probe passed in PATH step)"
          else
            echo "llvm-ar not found on PATH" >&2
            exit 1
          fi

      # The committed moduleinfo files must still match src/lib.rs.
      - name: moduleinfo matches lib.rs
        shell: bash
        run: npm run verify:moduleinfo

      # Release: the fingerprint tests need release speed, and the package
      # script builds release too. --test-threads=1: the engine is a
      # process singleton with global C++ voice state.
      - name: VST3 plugin tests (release)
        shell: bash
        run: npm run test:vst3

      - name: VST3 plugin clippy
        shell: bash
        run: npm run verify:clippy-vst3

      # One entry point per OS: the script builds the native binary for its
      # runner, assembles that OS's bundle layout, copies the licences and
      # the matching moduleinfo.json, and fails if GetPluginFactory is not
      # exported (nm -D / nm -gU / llvm-readobj --coff-exports per OS).
      - name: Build + package VST3 bundle
        shell: bash
        run: bash scripts/package-vst3-all.sh dist

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: GS1.vst3-${{ matrix.os }}
          path: dist/GS1.vst3
          retention-days: 7

  # P0.5 used to live here: an `e2e-engines` job that ran the whole suite on
  # WebKit and Firefox on every push. It is gone on purpose.
  #
  # WebKit on this app needs more than twenty minutes for a full pass even on a
  # warm workstation (measured: 19.1 min for the *fifty* most relevant tests,
  # 42.7 min for all 147 in v2.0.3), and the user's rule is that anything that
  # slow does not sit in the regular gate — it belongs to the slow lane. Firefox
  # was already slow-lane-only for the same reason. Both now run in `nightly`
  # below, which is schedule-gated and therefore cannot block a push or a PR.
  #
  # The coverage itself did not shrink: `nightly` runs both engines over `--all`
  # (it used to run WebKit `--all` and only the nightly subset for Firefox, because the
  # full Firefox pass was here).

  # Every engine over the whole suite, on the schedule *and* on every push/PR.
  #
  # The schedule run is the hard signal: all three engines over `--all` plus the
  # long benchmark (a scheduled red does not block a PR, but it has to be
  # visible).
  #
  # A push/PR run covers the same three engines and the same whole suite, as one
  # guarded step: a slow-engine flake or a host difference is a report there,
  # exactly the reason this job used to be schedule-only. That step is the
  # *only* thing tolerated -- a failed `npm ci` or build still fails the job --
  # and the scheduled steps below are not guarded at all, so the schedule keeps
  # the hard signal per engine.
  #
  # `--all` includes `e2e/visual.spec.ts` for every engine. Chromium compares the
  # committed baselines; WebKit and Firefox run it in the render-only smoke mode
  # `scripts/nightly-e2e.mjs` selects for them (the baselines are engine- and
  # host-specific, so there is nothing to compare against there).
  #
  # Neither run writes `docs/notes/nightly.md`: this workspace is thrown away,
  # so the record is the local/systemd run's job.
  #
  # On this runner there is no weston, so the script's `auto` display resolves to
  # `xvfb` and WebKit runs headed under it; Chromium and Firefox run headless.
  # The display path is recorded in the log line and (locally) in the table's
  # `显示` column.
  nightly:
    if: github.event_name == 'push' || github.event_name == 'pull_request' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Rust + wasm target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      # §一.39: this job pins `@stable` too, so a toolchain bump can break the
      # nightly the same way it broke the verify job. Print the versions before
      # anything that can fail, so a red nightly can be read against the
      # toolchain that produced it (`scripts/verify-ci.mjs` asserts the step).
      - name: Toolchain versions
        run: rustc --version && cargo --version && node --version && npm --version

      - name: Install clang and Xvfb
        run: sudo apt-get update && sudo apt-get install -y clang llvm xvfb

      - run: npm ci

      - name: Production build (WASM + SW)
        run: npm run build

      - name: Install Playwright Chromium + WebKit + Firefox
        run: npx playwright install --with-deps chromium webkit firefox

      # Push/PR: all three engines, the whole suite, one report.
      - name: Browser E2E (Chromium + WebKit + Firefox, whole suite; push/PR)
        if: github.event_name != 'schedule'
        continue-on-error: true
        run: npm run nightly -- --engines=chromium,webkit,firefox --all

      # Schedule: the same coverage as one unguarded step per engine.
      - name: Browser E2E (Chromium, whole suite)
        if: github.event_name == 'schedule'
        run: npm run nightly -- --engines=chromium --all

      - name: Browser E2E (WebKit, whole suite, headed under Xvfb)
        if: github.event_name == 'schedule'
        run: npm run nightly -- --engines=webkit --all

      - name: Browser E2E (Firefox, whole suite)
        if: github.event_name == 'schedule'
        run: npm run nightly -- --engines=firefox --all

      - name: Long sustained-load benchmark
        if: github.event_name == 'schedule'
        run: npm run bench:long

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nightly-logs
          path: |
            .tmp/nightly
            test-results
          retention-days: 14

  # §一.12 / §一.20⑦: the 48 visual baselines are a gate nobody ran, and they
  # drifted ten out of date before P11.3 noticed. `nightly --all` now runs
  # `e2e/visual.spec.ts` on every engine -- Chromium compares these baselines
  # there -- so this job is the *on-demand* view: dispatch it from the Actions
  # page when a diff needs pictures, and it uploads the
  # `-expected`/`-actual`/`-diff` triple for two weeks. It runs on nothing else;
  # `scripts/verify-ci.mjs` asserts that it is manual-dispatch only.
  #
  #   * **continue-on-error.** A red comparison on this runner can mean
  #     "different freetype" rather than "the app changed": the baselines were
  #     recorded on the development workstation (CachyOS). The job still reports
  #     failed and still uploads the diffs, but it never turns the run red on its
  #     own -- with a manual trigger there is no push to block, and this keeps
  #     the result readable as a report. Tightening that is the documented next
  #     step once the runner has shown what it does.
  #   * **`--update-snapshots=none`.** The command promises the job reports a
  #     diff and never records one. Playwright's default for a *missing*
  #     baseline is to write one and fail, which on a runner whose font stack
  #     differs would mint a "baseline" instead of showing the diff.
  #
  # This job's own artefacts are the `-expected`/`-actual`/`-diff` triple, kept
  # for two weeks, so the tightening decision can be made from pictures rather
  # than from a one-line failure.
  visual:
    if: github.event_name == 'workflow_dispatch'
    continue-on-error: true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Rust + wasm target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install clang (vendored C/C++ -> wasm)
        run: sudo apt-get update && sudo apt-get install -y clang llvm

      - run: npm ci

      # The suite compares against `dist/`: a fresh runner has no build, and
      # `vite preview` serves the built app, not the sources.
      - name: Production build (WASM + SW)
        run: npm run build

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Visual baselines (report only, records nothing)
        run: npm run test:visual -- --update-snapshots=none

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: visual-diffs
          path: test-results
          retention-days: 14
