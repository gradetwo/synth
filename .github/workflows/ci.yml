name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  schedule:
    # Nightly at 19:00 UTC (03:00 Beijing): the engines that are not worth a run
    # on every commit, plus the long benchmark. Waiting for a push let a
    # WebKit-only start-button regression sit unnoticed for days.
    - cron: '0 19 * * *'

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Rust + wasm target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install clang (vendored C/C++ -> wasm)
        run: sudo apt-get update && sudo apt-get install -y clang llvm

      - run: npm ci

      - name: Clippy (correctness / suspicious / perf)
        run: npm run verify:clippy

      - name: Rust DSP tests
        run: npm run test:rust

      - name: Front-end unit + worklet integration tests
        run: npm test

      - name: Production build (WASM + SW)
        run: npm run build

      # binaryen (wasm-opt / wasm-dis) is a devDependency, so `npm ci` above
      # installs it and `npm run build` (the step before this one) already
      # optimised both cores. Nothing extra to install here; if the binary is
      # ever unavailable the build degrades to unoptimised cores and
      # `verify:budget` fails on the dist total instead of the build breaking.
      - name: WASM quality gates (SIMD + scalar)
        run: node scripts/verify-wasm.mjs && node scripts/verify-wasm.mjs src/generated/synth_core_scalar.wasm && node scripts/verify-wasm-features.mjs

      - name: Lint
        run: npm run lint

      - name: Release preflight (version / changelog)
        run: npm run verify:release

      - name: Dist integrity
        run: npm run verify:dist

      - name: Payload budget
        run: npm run verify:budget

      - name: Audio quality gates (time + frequency domain)
        run: npm run verify:audio

      - name: Preset fingerprints (every factory preset)
        run: npm run verify:presets

      - name: Sustained-load benchmark
        run: npm run verify:bench

      - name: DSP regression baseline
        run: npm run test:dsp

      - name: DSP regression baseline (2x oversampling)
        run: npm run verify:dsp:2x

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Browser E2E (Chromium)
        run: npm run test:e2e

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dist
          path: dist
          retention-days: 7

  # P0.5: the same specs on the other two engines. The platform-sensitive parts
  # are audio (AudioWorklet, WebAudio autoplay), file import, the service worker
  # and touch — exactly what a Chromium-only run cannot speak for.
  e2e-engines:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Rust + wasm target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install clang (vendored C/C++ -> wasm)
        run: sudo apt-get update && sudo apt-get install -y clang llvm

      - run: npm ci

      - name: Production build (WASM + SW)
        run: npm run build

      - name: Install Playwright WebKit + Firefox
        run: npx playwright install --with-deps webkit firefox

      - name: Browser E2E (WebKit)
        run: npx playwright test --project=webkit

      - name: Browser E2E (Firefox)
        run: npx playwright test --project=firefox

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-engines-failures
          path: test-results
          retention-days: 7

  # The scheduled run: the same engines, the whole suite, plus the long
  # benchmark. It reports rather than blocks — a nightly that goes red for a
  # flaky click teaches everyone to ignore it — but its artefacts are kept.
  nightly:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Rust + wasm target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install clang and Xvfb
        run: sudo apt-get update && sudo apt-get install -y clang llvm xvfb

      - run: npm ci

      - name: Production build (WASM + SW)
        run: npm run build

      - name: Install Playwright WebKit + Firefox
        run: npx playwright install --with-deps webkit firefox

      - name: Browser E2E (WebKit, headed under Xvfb)
        run: npm run nightly -- --engines=webkit --all

      - name: Browser E2E (Firefox)
        run: npm run nightly -- --engines=firefox

      - name: Long sustained-load benchmark
        run: npm run bench:long

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nightly-logs
          path: |
            .tmp/nightly
            test-results
          retention-days: 14
