[package]
name = "synth-vst3"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false
description = "GROOVE SYNTH GS-1 as a VST3 instrument plugin (nih-plug wrapper around synth-core)"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
synth-core = { path = "../synth-core" }
# Pinned git rev: nih-plug is not on crates.io, it only ships via git.
nih_plug = { git = "https://github.com/robbert-vdh/nih-plug.git", rev = "de421011f41a6d10fc8c7a6084e4f4dee0143683" }
# Same rev as nih_plug: the egui editor adapter. Its `opengl` default
# feature links X11/GL on Linux (CI ubuntu runners and this dev machine
# have libx11-dev / libxkbcommon-dev); the editor is only constructed when
# a host opens it, never on the audio thread.
nih_plug_egui = { git = "https://github.com/robbert-vdh/nih-plug.git", rev = "de421011f41a6d10fc8c7a6084e4f4dee0143683" }
# The engine-state persist blob (see lib.rs EngineState) is serde JSON.
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
serde_json = "1"
